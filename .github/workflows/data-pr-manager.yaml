name: Data Pull Requests

on:
  push:
    branches:
      - chore/update-data
  workflow_dispatch:
    inputs:
      target_branch:
        description: "Branch to manage PR for"
        required: true
        type: choice
        options:
          - chore/update-data

concurrency:
  group: ${{ github.workflow }}-${{ github.event.inputs.target_branch || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.target_branch || github.ref }}

      - run: git fetch origin main

      - uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          sfw: true
          run-install: true
          cache: true

      - run: vp run action:pr-manager
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REF_NAME: ${{ github.event.inputs.target_branch || github.ref_name }}
